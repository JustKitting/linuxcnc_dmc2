# Machine-wide motor command resolution.
#
# USER-CONFIRMED ACTUAL — 2026-08-22:
# All three motor DIP banks SW1..SW5 are ON/OFF/ON/OFF/OFF.
MOTOR_PULSES_PER_REV=4000

# The previously tested motion programs were established at 800 pulses/rev.
# Reusable physical distances and rates are scaled from this reference.
REFERENCE_PULSES_PER_REV=800

# Compiled finite-jog policy. These are target distances and target-issuance
# rates; LinuxCNC's native planner remains responsible for physical velocity
# and acceleration.
PULSES_PER_MM=1000
PENDANT_X1_PULSES=10
PENDANT_X10_PULSES=100
PENDANT_X100_PULSES=1000
PENDANT_X1_TARGET_PULSES_PER_SECOND=5000
PENDANT_X10_TARGET_PULSES_PER_SECOND=75000
PENDANT_X100_TARGET_PULSES_PER_SECOND=300000
BOUNCE_PULSES=250
BOUNCE_TARGET_PULSES_PER_SECOND=1500
