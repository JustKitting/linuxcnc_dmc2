[package]
name = "dmc2ctl"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "dmc2ctl"
path = "src/main.rs"

[[bin]]
name = "dmc2-probe-capture"
path = "src/probe_capture/main.rs"

[dependencies]
dmc2-core = { path = "../dmc2-core" }
dmc2-diagnostics = { path = "../dmc2-diagnostics" }
dmc2-hal-sys = { path = "../dmc2-hal-sys" }
