# DMC2 Mini + Mesa 7I95T live configuration.
#
# Every physical value below is either USER-OBSERVED ACTUAL or the exact
# provisional value accepted on 2026-08-22.  This file is never launched by
# the offline validator.

[EMC]
VERSION = 1.1
MACHINE = DMC2-MINI-PROVISIONAL
DEBUG = 0

[DISPLAY]
DISPLAY = ../native/bin/dmc2-process-supervisor --role axis --journal ../var/log/linuxcnc/process-lifecycle.tsv -- /usr/bin/axis
CYCLE_TIME = 0.050
POSITION_OFFSET = MACHINE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 1.0
MAX_SPINDLE_OVERRIDE = 1.0
DEFAULT_LINEAR_VELOCITY = 2.5
MAX_LINEAR_VELOCITY = 30.0
INCREMENTS = Continuous, 1 mm, 0.1 mm, 0.01 mm
INTRO_TIME = 0
PROGRAM_PREFIX = ./nc_files
PYVCP = ui/status_panel.xml
USER_COMMAND_FILE = ../python/dmc2_axis/axis_user_command.py

[TASK]
TASK = ../native/bin/dmc2-process-supervisor --role milltask --journal ../var/log/linuxcnc/process-lifecycle.tsv -- /usr/bin/milltask
CYCLE_TIME = 0.001

[RS274NGC]
PARAMETER_FILE = dmc2.var
SUBROUTINE_PATH = ./nc_files
ON_ABORT_COMMAND = o<dmc2_abort> call

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[EMCIO]
EMCIO = ../native/bin/dmc2-process-supervisor --role iocontrol --journal ../var/log/linuxcnc/process-lifecycle.tsv -- /usr/bin/io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[HAL]
HALUI = ../native/bin/dmc2-process-supervisor --role halui --journal ../var/log/linuxcnc/process-lifecycle.tsv -- /usr/bin/halui
HALFILE = machine.hal
HALFILE = pendant.hal
POSTGUI_HALFILE = hal/status_postgui.hal

[HALUI]

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 2.5
MAX_LINEAR_VELOCITY = 30.0
DEFAULT_LINEAR_ACCELERATION = 50.0
MAX_LINEAR_ACCELERATION = 50.0
# Preserve LinuxCNC's internal joint coordinates across restarts.  The axes
# remain explicitly unhomed until the physical limit-switch homing sequence;
# this file only prevents an unhomed restart from placing every coordinate on
# its negative soft-limit boundary.
POSITION_FILE = ../var/state/linuxcnc-position.txt
# Relative contact-calibration programs are allowed to run before homing.
# Their catalog entries still determine which operations may use that state;
# absolute-position programs retain an explicit all-homed prerequisite.
NO_FORCE_HOMING = 1
SPINDLES = 1

# LinuxCNC spindle commands are RPM. The top-down physical direction mapping
# has been verified: M3 is clockwise and M4 is counterclockwise. The DMC2 Mini
# manufacturer specifies 24,000 RPM maximum for the stock spindle.
[SPINDLE_0]
MIN_FORWARD_VELOCITY = 6000
MAX_FORWARD_VELOCITY = 24000
MIN_REVERSE_VELOCITY = 6000
MAX_REVERSE_VELOCITY = 24000
INCREMENT = 1000

[KINS]
KINEMATICS = trivkins coordinates=XYZ
JOINTS = 3

# Normal Cartesian operating zone accepted by the user.  These remain the
# active post-home software travel limits.
[AXIS_X]
MIN_LIMIT = 0.0
MAX_LIMIT = 300.0
MAX_VELOCITY = 30.0
MAX_ACCELERATION = 50.0

[AXIS_Y]
MIN_LIMIT = 0.0
MAX_LIMIT = 173.0
MAX_VELOCITY = 30.0
MAX_ACCELERATION = 50.0

[AXIS_Z]
MIN_LIMIT = 0.0
MAX_LIMIT = 135.0
MAX_VELOCITY = 30.0
MAX_ACCELERATION = 50.0

# Home All order: finish Z (sequence 0), then X (1), then Y (2).
# JOINT_0 = X = Mesa stepgen 1 = physical LEFT / LinuxCNC +X = IN11.
# HOME_SEARCH_VEL +5.0: 5000 pulses/s fast approach.
# HOME_LATCH_VEL +0.25: 250 pulses/s final positive switch approach.
# HOME_OFFSET 300.25 records the accepted switch point 250 pulses beyond the
# normal X soft maximum; HOME 300.0 then makes the exact 250-pulse backoff.
# STEPGEN_MAX_ACC is 0 on all joints so HostMot2 follows the already
# acceleration-limited LinuxCNC trajectory directly instead of applying a
# second limiter and creating a false following error during x10/x100 jogs.
[JOINT_0]
TYPE = LINEAR
MIN_LIMIT = 0.0
MAX_LIMIT = 300.25
MAX_VELOCITY = 30.0
MAX_ACCELERATION = 50.0
FERROR = 0.050
MIN_FERROR = 0.010
SCALE = 1000.0
STEPGEN_MAX_VEL = 33.0
STEPGEN_MAX_ACC = 0.0
DIRSETUP = 10000
DIRHOLD = 10000
STEPLEN = 5000
STEPSPACE = 5000
HOME = 300.0
HOME_OFFSET = 300.25
HOME_SEARCH_VEL = 5.0
HOME_LATCH_VEL = 0.25
HOME_FINAL_VEL = 0.25
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
HOME_IS_SHARED = NO
HOME_SEQUENCE = 1

# JOINT_1 = Y = Mesa stepgen 0 = positive physical forward = IN9.
[JOINT_1]
TYPE = LINEAR
MIN_LIMIT = 0.0
MAX_LIMIT = 173.25
MAX_VELOCITY = 30.0
MAX_ACCELERATION = 50.0
FERROR = 0.050
MIN_FERROR = 0.010
SCALE = 1000.0
STEPGEN_MAX_VEL = 33.0
STEPGEN_MAX_ACC = 0.0
DIRSETUP = 10000
DIRHOLD = 10000
STEPLEN = 5000
STEPSPACE = 5000
HOME = 173.0
HOME_OFFSET = 173.25
HOME_SEARCH_VEL = 5.0
HOME_LATCH_VEL = 0.25
HOME_FINAL_VEL = 0.25
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
HOME_IS_SHARED = NO
HOME_SEQUENCE = 2

# JOINT_2 = Z = Mesa stepgen 2 = positive physical up = IN10.
[JOINT_2]
TYPE = LINEAR
MIN_LIMIT = 0.0
MAX_LIMIT = 135.25
MAX_VELOCITY = 30.0
MAX_ACCELERATION = 50.0
FERROR = 0.050
MIN_FERROR = 0.010
SCALE = 1000.0
STEPGEN_MAX_VEL = 33.0
STEPGEN_MAX_ACC = 0.0
DIRSETUP = 10000
DIRHOLD = 10000
STEPLEN = 5000
STEPSPACE = 5000
HOME = 135.0
HOME_OFFSET = 135.25
HOME_SEARCH_VEL = 5.0
HOME_LATCH_VEL = 0.25
HOME_FINAL_VEL = 0.25
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
HOME_IS_SHARED = NO
HOME_SEQUENCE = 0

[DMC2]
MESA_IP = 192.168.1.121
MESA_HAL_NAME = hm2_7i95.0
PULSES_PER_MM = 1000
PENDANT_PORT = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
PENDANT_BAUD = 115200
PUCK_MACHINE_X = 288.125
PUCK_MACHINE_Y = 152.955
PENDANT_TIMEOUT_MS = 100
SPINDLE_RATED_RPM = 24000
SPINDLE_MINIMUM_RPM = 6000
SPINDLE_MAXIMUM_RPM = 24000
SPINDLE_TEST_TRANSITION_TIMEOUT_SECONDS = 30.0
SPINDLE_EXPECTED_F004_CENTIHZ = 4000
SPINDLE_EXPECTED_F005_CENTIHZ = 4000
SPINDLE_AT_SPEED_TOLERANCE_HZ = 1.0

[PROBE_CALIBRATION]
# User-accepted calibration data. Offsets are the signed probe-center vector
# relative to the spindle center in LinuxCNC axes; they are not motion commands.
# Exact operands, formulas, frames, and evidence are retained in
# ../docs/probe-calibration.md.
PUCK_HEIGHT_MM = 19.400000
CALIBRATION_CUTTER_DIAMETER_MM = 9.230000
SIDE_PROBE_DIAMETER_MM = 9.710000
RADIUS_CORRECTION_MM = 0.240000
PROBE_OFFSET_X_MM = -51.137072
PROBE_OFFSET_Y_MM = 14.992500
