# OFFLINE GUI/HAL VALIDATION CONFIGURATION.
# Every numeric motion value below belongs only to the simulator. None is a
# DMC2 machine setting and none may be copied into the eventual live config.

[EMC]
VERSION = 1.1
MACHINE = DMC2-OFFLINE-MONITOR-SIMULATION
DEBUG = 0

[DISPLAY]
DISPLAY = axis
CYCLE_TIME = 0.100
POSITION_OFFSET = MACHINE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 1.0
MAX_SPINDLE_OVERRIDE = 1.0
DEFAULT_LINEAR_VELOCITY = 0.1
MAX_LINEAR_VELOCITY = 0.2
INTRO_TIME = 0
PROGRAM_PREFIX = /tmp
PYVCP = ../status_panel.xml

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[RS274NGC]
PARAMETER_FILE = sim.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[HAL]
HALUI = halui
HALFILE = core_sim.hal
HALFILE = ../pendant_replay.hal
HALFILE = status_sources.hal
HALFILE = ../status_latches.hal
POSTGUI_HALFILE = ../status_postgui.hal

[HALUI]

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 0.1
MAX_LINEAR_VELOCITY = 0.2

[KINS]
KINEMATICS = trivkins coordinates=XYZ
JOINTS = 3

[AXIS_X]
MIN_LIMIT = -1.0
MAX_LIMIT = 1.0
MAX_VELOCITY = 0.2
MAX_ACCELERATION = 1.0

[AXIS_Y]
MIN_LIMIT = -1.0
MAX_LIMIT = 1.0
MAX_VELOCITY = 0.2
MAX_ACCELERATION = 1.0

[AXIS_Z]
MIN_LIMIT = -1.0
MAX_LIMIT = 1.0
MAX_VELOCITY = 0.2
MAX_ACCELERATION = 1.0

[JOINT_0]
TYPE = LINEAR
MIN_LIMIT = -1.0
MAX_LIMIT = 1.0
MAX_VELOCITY = 0.2
MAX_ACCELERATION = 1.0
FERROR = 0.1
MIN_FERROR = 0.01
HOME = 0.0
HOME_OFFSET = 0.0
HOME_SEQUENCE = 0

[JOINT_1]
TYPE = LINEAR
MIN_LIMIT = -1.0
MAX_LIMIT = 1.0
MAX_VELOCITY = 0.2
MAX_ACCELERATION = 1.0
FERROR = 0.1
MIN_FERROR = 0.01
HOME = 0.0
HOME_OFFSET = 0.0
HOME_SEQUENCE = 0

[JOINT_2]
TYPE = LINEAR
MIN_LIMIT = -1.0
MAX_LIMIT = 1.0
MAX_VELOCITY = 0.2
MAX_ACCELERATION = 1.0
FERROR = 0.1
MIN_FERROR = 0.01
HOME = 0.0
HOME_OFFSET = 0.0
HOME_SEQUENCE = 0
